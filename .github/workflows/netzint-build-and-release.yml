on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:

name: Build und publish release

jobs:
  deb-package:
    name: build all DEB-Packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable deb-src repositories
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            src
          key: build-${{ hashFiles('build/conf.d/*', 'build/config/**', 'build/run.d/*', 'build/patches/**') }}
          restore-keys: |
            build-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ hashFiles('build/conf.d/2_kernel-versions', 'build/config/kernel-*') }}
          restore-keys: |
            ccache-

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y debhelper

      - name: Install build dependencies
        run: ./get-depends.sh

      - name: Configure ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --max-size=3G
          ccache --zero-stats

      - name: Build
        run: ./buildpackage.sh

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Shrink build cache
        if: always()
        run: |
          # Remove kernel object files to keep cache size within GitHub's 10GB repo limit.
          # The build scripts only check for bzImage, .config, linbo64 and lib/modules/
          # to decide whether to skip recompilation, so .o files are not needed in cache.
          find src/*/linux-*/ \( -name "*.o" -o -name "*.cmd" -o -name "*.d" \
            -o -name "*.mod" -o -name "*.mod.c" -o -name ".tmp_*" \
            -o -name "*.tmp" -o -name "*.order" \) -delete 2>/dev/null || true

      - name: Copy artifacts
        run: mkdir archives && cp ../*.* ./archives

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: archives/*

  github-release:
    needs: deb-package
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deb-packages

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Assets
        id: upload-release-assets
        uses: dwenegar/upload-release-assets@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
          assets_path: .

  publish-release:
    needs: github-release
    name: Publish latest release to package server
    runs-on: ubuntu-24.04
    steps:
      - name: Download assets from latest release
        uses: Itsblue/download-release-assets-action@v4
        with:
          file: ".*"
          path: "."
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy package to package server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REPO_SSH_HOST }}
          username: ${{ secrets.REPO_SSH_USER }}
          key: ${{ secrets.REPO_SSH_KEY }}
          port: 22
          source: "./*"
          target: ${{ secrets.REPO_SSH_INCOMING_PATH }}

      - name: Publish package
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REPO_SSH_HOST }}
          username: ${{ secrets.REPO_SSH_USER }}
          key: ${{ secrets.REPO_SSH_KEY }}
          port: 22
          script: /usr/local/bin/publish-debs lmn7
